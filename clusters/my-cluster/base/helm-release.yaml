apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentos
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./agentos
      sourceRef:
        kind: GitRepository
        name: agentos-infra
        namespace: flux-system
      reconcileStrategy: Revision
  timeout: 10m
  values: {}

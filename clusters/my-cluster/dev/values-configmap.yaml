apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-dev
  namespace: dev
data:
  values.yaml: |
    litellm:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    pgsql-relational:
      primary:
        persistence:
          size: 5Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-dev
  namespace: dev
data:
  values.yaml: |
    litellm:
      replicaCount: 1
      image:
        repository: docker.litellm.ai/berriai/litellm
        tag: "main-stable"
      podAnnotations:
        k8s.aliyun.com/eci-registry-mirror: "https://6alghj85.mirror.aliyuncs.com"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    pgsql-relational:
      primary:
        podAnnotations:
          k8s.aliyun.com/eci-registry-mirror: "https://6alghj85.mirror.aliyuncs.com"
        persistence:
          storageClass: alicloud-disk-topology-alltype
          size: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

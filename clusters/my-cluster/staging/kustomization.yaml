apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/helm-release.yaml

patches:
  - target:
      kind: HelmRelease
      name: agentos
    patch: |
      - op: replace
        path: /metadata/namespace
        value: staging
      - op: add
        path: /spec/targetNamespace
        value: staging
      - op: add
        path: /spec/install
        value:
          createNamespace: true
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: agentos-values-staging

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-staging
  namespace: staging
data:
  values.yaml: |
    litellm:
      replicaCount: 2
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    pgsql-relational:
      primary:
        persistence:
          size: 10Gi
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

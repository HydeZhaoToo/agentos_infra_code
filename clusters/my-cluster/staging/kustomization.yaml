apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/helm-release.yaml
  - values-configmap.yaml

patches:
  - target:
      kind: HelmRelease
      name: agentos
    patch: |
      - op: replace
        path: /metadata/namespace
        value: staging
      - op: add
        path: /spec/targetNamespace
        value: staging
      - op: add
        path: /spec/install
        value:
          createNamespace: true
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: agentos-values-staging

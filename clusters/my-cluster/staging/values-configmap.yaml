apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-staging
  namespace: staging
data:
  values.yaml: |
    litellm:
      replicaCount: 2
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    pgsql-relational:
      primary:
        persistence:
          size: 10Gi
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

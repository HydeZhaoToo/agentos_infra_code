apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/git-repo.yaml
  - ../base/helm-release.yaml

patches:
  - target:
      kind: HelmRelease
      name: agentos
    patch: |
      - op: replace
        path: /metadata/namespace
        value: production
      - op: add
        path: /spec/targetNamespace
        value: production
      - op: add
        path: /spec/install
        value:
          createNamespace: true
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: agentos-values-production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-production
  namespace: production
data:
  values.yaml: |
    litellm:
      replicaCount: 3
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
    pgsql-relational:
      primary:
        persistence:
          size: 50Gi
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
      metrics:
        enabled: true

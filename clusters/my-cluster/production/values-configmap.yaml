apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-values-production
  namespace: production
data:
  values.yaml: |
    litellm:
      replicaCount: 3
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
    pgsql-relational:
      primary:
        persistence:
          size: 50Gi
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
      metrics:
        enabled: true
